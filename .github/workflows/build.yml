# Builds wypozyczalnia.exe for Windows.
# - every push to main: tests + exe as a workflow artifact
# - tag v*: also publishes a GitHub Release with the exe to download
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Windows icon and version info
        working-directory: cmd/wypozyczalnia
        run: |
          V="${{ steps.ver.outputs.version }}"
          NUM="${V%%-*}"
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 \
            --icon ../../assets/icon.png --manifest gui \
            --product-name "Wypożyczalnia" --file-description "Wypożyczalnia pojazdów" \
            --product-version "$NUM" --file-version "$NUM"

      - name: Build wypozyczalnia.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${{ steps.ver.outputs.version }}" -o wypozyczalnia.exe ./cmd/wypozyczalnia

      - uses: actions/upload-artifact@v4
        with:
          name: wypozyczalnia-${{ steps.ver.outputs.version }}
          path: wypozyczalnia.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wypozyczalnia.exe
          generate_release_notes: true
